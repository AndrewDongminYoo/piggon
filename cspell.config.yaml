version: "0.2"
useGitignore: true
ignorePaths:
  - pnpm-lock.yaml
dictionaryDefinitions:
  - name: custom-dictionary
    path: ./.cspell/custom-dictionary.txt
    addWords: true
language: en,it-IT
dictionaries:
  - custom-dictionary
  - node
  - npm
  - typescript
  - softwareTerms
  - filetypes
  - fonts
words: []
ignoreWords: []
import: ["@cspell/dict-it-it/cspell-ext.json"]
