name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
        env:
          ADMIN_GOOGLE_EMAIL: admin@example.com
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: 7d3e43c57d035f8762f60f374bc1f83f
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_hrOdkBTCrOKvZCXPWGpUbg_dpZzUSbL
          NEXT_PUBLIC_SUPABASE_URL: https://wdizkhonzlquyxdardeb.supabase.co

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.113.0
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase test db --local
